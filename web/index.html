<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chesstnut</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <nav id="sidebar" class="sidebar"></nav>

    <div class="app-content">
      <div class="app-banner">
        <img class="app-banner-icon" src="pieces/bN.svg" alt="" aria-hidden="true" />
        <div class="app-banner-text">
          <span class="app-banner-title">Chesstnut</span>
          <span class="app-banner-subtitle" id="page-heading-subtitle">Play</span>
        </div>
        <img class="app-banner-icon" src="pieces/wN.svg" alt="" aria-hidden="true" />
      </div>

      <div id="game-layout" class="game-layout">
        <!-- Invisible mirror of #pgn-panel's width, purely so board-area
             sits centered between two equal flanks. The eval bar itself is
             absolutely positioned inside board-area (see style.css) and
             doesn't participate in this flex row at all, so toggling it
             on/off never moves anything else — it just pops in place. -->
        <div class="game-layout-spacer" aria-hidden="true"></div>

        <div class="board-area">
          <div id="eval-bar-column" class="eval-bar-column hidden">
            <select id="eval-bar-depth" class="eval-bar-depth">
              <option value="1">Depth 1</option>
              <option value="2">Depth 2</option>
              <option value="3">Depth 3</option>
              <option value="4">Depth 4</option>
              <option value="5">Depth 5</option>
              <option value="6">Depth 6</option>
              <option value="7">Depth 7</option>
              <option value="8" selected>Depth 8</option>
            </select>
            <div id="eval-bar">
              <div id="eval-bar-black" class="eval-bar-segment eval-bar-black"></div>
              <div id="eval-bar-white" class="eval-bar-segment eval-bar-white"></div>
            </div>
            <div id="eval-bar-text"></div>
          </div>

          <div class="board-column">
            <div id="black-clock" class="clock"></div>
            <div class="board-wrapper">
              <div id="board"></div>
              <div id="promotion-picker" class="hidden"></div>
            </div>
            <div id="white-clock" class="clock"></div>
            <p id="status"></p>
            <!-- Play and Analysis show different action buttons (New
                 Game/Resign vs. Reset Position/Flip Board) for the same
                 shared board area — only one of these two rows is visible
                 at a time, toggled by main.js based on the active page. -->
            <div id="play-buttons" class="board-buttons hidden">
              <button id="new-game">New Game</button>
              <button id="resign">Resign</button>
            </div>
            <div id="analysis-buttons" class="board-buttons hidden">
              <button id="analysis-reset">Reset Position</button>
              <button id="analysis-flip">Flip Board</button>
            </div>
          </div>
        </div>

        <div id="pgn-panel">
          <div id="pgn-header">
            <span>PGN</span>
            <span class="pgn-header-buttons">
              <!-- Import only makes sense on the Analysis tab (loading a
                   game to study) — hidden on Play, shown on Analysis. -->
              <button id="import-pgn" class="hidden">Import</button>
              <button id="copy-pgn">Copy</button>
            </span>
          </div>
          <div id="pgn-toggle" class="hidden">··· show earlier moves</div>
          <table id="pgn-table"></table>
        </div>
      </div>

      <div id="fen-box">
        <label for="fen-text">FEN</label>
        <input id="fen-text" type="text" />
        <button id="load-fen">Load</button>
        <button id="copy-fen">Copy</button>
      </div>
    </div>

    <div class="shell-spacer" aria-hidden="true"></div>
  </div>

  <!-- Small, extendable preferences widget — currently just interaction
       mode and sound, both persisted to localStorage. New settings later
       are a new row here plus a field in main.js's settings object, not a
       restructure. -->
  <div id="settings-widget" class="settings-widget">
    <button id="settings-toggle" class="settings-toggle">Settings</button>
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-row settings-row-stacked">
        <span class="settings-label">Move pieces by</span>
        <div class="settings-choice">
          <button type="button" class="settings-choice-option" data-mode="drag">Drag</button>
          <button type="button" class="settings-choice-option" data-mode="click">Click</button>
        </div>
      </div>
      <label class="settings-row settings-checkbox-row">
        <input type="checkbox" id="settings-mute" />
        <span>Mute sound</span>
      </label>
    </div>
  </div>

  <div id="clock-picker-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2>Choose a time control</h2>
      <div id="clock-presets" class="clock-presets"></div>

      <div class="setup-rows">
        <div class="settings-row">
          <span class="settings-label">Opponent</span>
          <div class="settings-choice" id="opponent-choice">
            <button type="button" class="settings-choice-option" data-opponent="human">Human</button>
            <button type="button" class="settings-choice-option" data-opponent="computer">Computer</button>
          </div>
        </div>
        <div class="settings-row hidden" id="color-choice-row">
          <span class="settings-label">Play as</span>
          <div class="settings-choice" id="color-choice">
            <button type="button" class="settings-choice-option" data-color="white">White</button>
            <button type="button" class="settings-choice-option" data-color="black">Black</button>
          </div>
        </div>
        <div class="settings-row hidden" id="computer-depth-row">
          <span class="settings-label">Computer strength</span>
          <select id="computer-depth" class="eval-bar-depth">
            <option value="1">Depth 1</option>
            <option value="2">Depth 2</option>
            <option value="3">Depth 3</option>
            <option value="4">Depth 4</option>
            <option value="5">Depth 5</option>
            <option value="6">Depth 6</option>
            <option value="7">Depth 7</option>
            <option value="8" selected>Depth 8</option>
          </select>
        </div>
      </div>

      <label class="eval-bar-toggle">
        <input type="checkbox" id="eval-bar-checkbox" />
        Eval bar
      </label>
    </div>
  </div>

  <div id="game-over-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="game-over-title"></h2>
      <p id="game-over-detail"></p>

      <div class="game-over-share">
        <div class="game-over-share-row">
          <label for="game-over-fen">FEN</label>
          <input id="game-over-fen" type="text" readonly />
          <button id="game-over-copy-fen">Copy</button>
        </div>
        <div class="game-over-share-row">
          <label for="game-over-pgn">PGN</label>
          <input id="game-over-pgn" type="text" readonly />
          <button id="game-over-copy-pgn">Copy</button>
        </div>
      </div>

      <button id="game-over-close">New Game</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
