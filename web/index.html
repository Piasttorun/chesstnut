<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chesstnut</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Chesstnut</h1>

  <div class="game-layout">
    <div id="eval-bar-column" class="eval-bar-column hidden">
      <select id="eval-bar-depth" class="eval-bar-depth">
        <option value="1">Depth 1</option>
        <option value="2">Depth 2</option>
        <option value="3" selected>Depth 3</option>
        <option value="4">Depth 4</option>
      </select>
      <div id="eval-bar">
        <div id="eval-bar-black" class="eval-bar-segment eval-bar-black"></div>
        <div id="eval-bar-white" class="eval-bar-segment eval-bar-white"></div>
      </div>
      <div id="eval-bar-text"></div>
    </div>

    <div class="board-column">
      <div id="black-clock" class="clock"></div>
      <div class="board-wrapper">
        <div id="board"></div>
        <div id="promotion-picker" class="hidden"></div>
      </div>
      <div id="white-clock" class="clock"></div>
      <p id="status"></p>
      <div class="board-buttons">
        <button id="new-game">New Game</button>
        <button id="resign">Resign</button>
      </div>
    </div>

    <div id="pgn-panel">
      <div id="pgn-header">
        <span>PGN</span>
        <span class="pgn-header-buttons">
          <button id="import-pgn">Import</button>
          <button id="copy-pgn">Copy</button>
        </span>
      </div>
      <div id="pgn-toggle" class="hidden">··· show earlier moves</div>
      <table id="pgn-table"></table>
    </div>
  </div>

  <div id="fen-box">
    <label for="fen-text">FEN</label>
    <input id="fen-text" type="text" />
    <button id="load-fen">Load</button>
    <button id="copy-fen">Copy</button>
  </div>

  <div id="clock-picker-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2>Choose a time control</h2>
      <div id="clock-presets" class="clock-presets"></div>
      <label class="eval-bar-toggle">
        <input type="checkbox" id="eval-bar-checkbox" />
        Eval bar
      </label>
    </div>
  </div>

  <div id="game-over-overlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="game-over-title"></h2>
      <p id="game-over-detail"></p>
      <button id="game-over-close">New Game</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
